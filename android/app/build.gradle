plugins { id 'com.android.application' }
android {
  namespace 'io.github.bullet2013.aquatv'
  compileSdk 36
  defaultConfig {
    applicationId 'io.github.bullet2013.aquatv.exo2test'
    minSdk 23
    targetSdk 35
    versionCode 4
    versionName '0.4.0-exo2-ffmpeg'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  buildTypes {
    release { minifyEnabled false }
    debug { applicationIdSuffix '' }
  }
}
dependencies {
  implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
  // FFmpeg audio-only decoder, compiled for the same ExoPlayer 2.19.1 API.
  implementation 'io.github.shenbengit.exoplayer-extensions:ffmpeg:1.0.0'
  implementation 'androidx.webkit:webkit:1.13.0'
}
