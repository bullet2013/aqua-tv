<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQUA TV FAST</title>
<link rel="stylesheet" href="https://bullet2013.github.io/aqua-tv/tv-fast/fast.css?v=2">
<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="fast-bridge.js"></script></head><body>
<!-- Samsung AVPlay needs a real object surface. The streaming video is
     composited below the HTML UI; this element stays mounted in both modes. -->
<object id="avplayObject" type="application/avplayer" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none"></object>
<div id="videoSurface"></div>
<section id="full"><div id="osd"><div id="osdLogo"></div><div id="osdText"><div id="osdName"></div><div id="osdNow"></div><div id="osdProgressRow"><div id="osdTrack"><div id="osdProgress"></div></div><span id="osdLeft"></span></div><div id="osdNext"></div></div><div id="resolution"></div></div></section>
<main id="guide" class="hidden"><aside id="categories" class="hidden"><div id="cats"></div></aside><div id="channels"><div id="rows"></div></div><aside id="right"><div id="preview"></div><div id="current"></div><div id="upcoming"></div></aside></main>
<div id="details" class="hidden"><h2 id="detailTitle"></h2><div id="detailTime"></div><p id="detailBody"></p><small>Назад — закрыть</small></div><div id="loading">AQUA TV — загрузка…</div>
<script src="https://bullet2013.github.io/aqua-tv/tv-fast/fast.js?v=2"></script>
</body></html>
