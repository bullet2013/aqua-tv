<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQUA TV</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:transparent}#loading{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;color:transparent;font-size:0;z-index:9999}#loading.hidden{display:none!important}</style><script src="$WEBAPIS/webapis/webapis.js"></script><script src="fast-bridge.js"></script></head><body><object id="avplayObject" type="application/avplayer" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none"></object>

<script>
// Refresh server assets once per launch; no widget rebuild for UI updates.
(function(){
var base='https://bullet2013.github.io/aqua-tv/tv-fast/',v=Date.now();
var css=document.createElement('link');css.rel='stylesheet';css.href=base+'fast.css?v='+v;document.head.appendChild(css);

js.onerror=function(){if(window.console&&console.error)console.error('AQUA TV: unable to load remote UI');};
