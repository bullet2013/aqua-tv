name: AQUA TV — Tizen widget source
on:
  pull_request:
    branches: [main]
    paths:
      - 'tizen/**'
      - '.github/workflows/tizen-widget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package ES5 website scripts and CSS inside widget
        run: |
          set -euo pipefail
          git fetch --depth=1 origin feature/legacy-compatible-web-ui
          mkdir -p .tizen-web-src/tools
          for file in app.js styles.css babel.config.json tools/build-legacy-ui.mjs; do
            mkdir -p ".tizen-web-src/$(dirname "$file")"
            git show "FETCH_HEAD:$file" > ".tizen-web-src/$file"
          done
          (
            cd .tizen-web-src
            npm install --no-save --no-audit --no-fund @babel/core@7 @babel/cli@7 @babel/preset-env@7 core-js-bundle@3 regenerator-runtime@0.14 pako@2 whatwg-fetch@3 text-encoding@0.7
            node tools/build-legacy-ui.mjs
          )
          cp .tizen-web-src/styles.css tizen/styles.css
          cp .tizen-web-src/dist/legacy/app.js tizen/app.js
          cp .tizen-web-src/dist/legacy/polyfills.js tizen/polyfills.js
          cat .tizen-web-src/node_modules/whatwg-fetch/dist/fetch.umd.js >> tizen/polyfills.js
          cat .tizen-web-src/node_modules/text-encoding/lib/encoding.js >> tizen/polyfills.js
          cp .tizen-web-src/dist/legacy/pako.min.js tizen/pako.min.js
          node --check tizen/app.js
          test -s tizen/polyfills.js
          rm -rf .tizen-web-src
      - name: Validate widget resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path=Path('tizen')
          ET.parse(path/'config.xml')
          for name in ('index.html','bridge.js','config.js'):
              assert (path/name).is_file(), name
          assert 'window.AquaAndroid' in (path/'bridge.js').read_text()
          assert 'webapis.avplay' in (path/'bridge.js').read_text()
          PY
          node --check tizen/bridge.js
          node --check tizen/config.js
      - name: Package unsigned widget source
        run: |
          cd tizen
          zip -q -9 ../AQUA-TV-Tizen-UNSIGNED.wgt config.xml index.html bridge.js config.js app.js styles.css tv-compat.css polyfills.js pako.min.js
      - uses: actions/upload-artifact@v4
        with:
          name: AQUA-TV-Tizen-widget-unsigned
          path: AQUA-TV-Tizen-UNSIGNED.wgt
          retention-days: 30
