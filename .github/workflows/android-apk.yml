name: AQUA TV — Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить проект
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Настроить Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Установить Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Установить NDK и CMake для аудиодекодеров
        run: sdkmanager --install 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Подготовить FFmpeg AC3 MP2 EAC3
        run: bash android/scripts/prepare-ffmpeg-audio.sh
      - name: Собрать установочный APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Проверить 32-битную библиотеку FFmpeg в APK
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as apk:
              libs = [p for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')]
              print('Native libraries:', libs)
              assert 'lib/armeabi-v7a/libffmpegJNI.so' in libs, 'Missing ARMv7 FFmpeg'
              assert not any(p.startswith('lib/arm64-v8a/') for p in libs), 'Wrong ARM64 library'
          PY
      - name: Скачать APK из Actions
        uses: actions/upload-artifact@v4
        with:
          name: AQUA-TV-Beelink-32bit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
